name: CI

on:
  push:
    branches: [master]
  pull_request:

# Only keep the latest run per branch/PR; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y cmake libjpeg-dev libpng-dev

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-${{ matrix.profile }}

      # Tests, not just a build. The `link` module takes the address of every
      # function of every enabled feature, which is what forces the linker to
      # resolve them; a plain `cargo build` proves very little about the
      # libraries build.rs picked, because Rust emits no undefined symbol for an
      # `extern` function that is declared but never referenced.
      - name: Test
        shell: bash
        run: cargo test ${{ matrix.profile == 'release' && '--release' || '' }}

  # Each feature on its own. This is *not* redundant with the job above: when
  # every feature is enabled, every libmv library gets built, so an incomplete
  # `targets` list in build.rs is masked by whichever other area happens to pull
  # the missing library in. Enabling a single area is the only configuration in
  # which such an omission actually fails.
  #
  # Linux and debug only. The cmake build is always Release regardless of the
  # Cargo profile, so the profile changes nothing about what gets linked, and
  # the job above already covers Windows.
  feature:
    name: Feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - image
          - track-region
          - homography
          - camera-intrinsics
          - tracks
          - detector
          - autotrack
          - reconstruction
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y cmake libjpeg-dev libpng-dev

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: feature-${{ matrix.feature }}

      - name: Test
        run: cargo test --no-default-features --features ${{ matrix.feature }}

  clippy:
    name: Clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y cmake libjpeg-dev libpng-dev

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # The generated bindings differ per feature set, so lint a minimal one
      # too. This is what catches a `cfg(feature = ...)` in the tests that no
      # longer lines up with the bindings actually generated for that set.
      - name: Run clippy (minimal features)
        run: cargo clippy --all-targets --no-default-features --features track-region -- -D warnings

  fmt:
    name: Rustfmt (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-key: fmt

      - name: Check formatting
        run: cargo fmt --check