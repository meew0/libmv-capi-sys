[package]
name = "libmv-capi-sys"
version = "0.1.4"
edition = "2021"
links = "mv"
license = "GPL-2.0-or-later"
keywords = ["motion-tracking", "multiview", "libmv", "blender", "video"]
categories = ["external-ffi-bindings"]
description = "Unsafe FFI bindings for libmv, Blender's motion-tracking library"
readme = "README.md"
repository = "https://github.com/meew0/libmv-capi-sys"

[features]
# Enable all areas by default
default = ["full"]

full = [
    "autotrack",
    "camera-intrinsics",
    "detector",
    "homography",
    "image",
    "reconstruction",
    "track-region",
    "tracks",
]

image = []
track-region = ["image"]
homography = []
camera-intrinsics = []
tracks = []
detector = ["image"]
autotrack = ["track-region"]
reconstruction = ["camera-intrinsics"]

[build-dependencies]
cc = "1.0"
bindgen = "0.68"
